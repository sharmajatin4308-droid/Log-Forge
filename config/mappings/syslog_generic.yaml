profile_id: syslog_generic
profile_version: "1.0"
format_id: syslog
vendor: null
product: null

timestamp:
  source_field: timestamp_raw
  formats:
    - "%b %d %H:%M:%S"
    - "%b  %d %H:%M:%S"
    - "%Y-%m-%dT%H:%M:%S%z"

field_mappings:
  src: src_endpoint.ip
  dst: dst_endpoint.ip
  dpt: dst_endpoint.port
  spt: src_endpoint.port
  proto: connection_info.protocol_name
  action: _action_raw        # intermediate; evaluated by activity_rules
  msg: message
  hostname: metadata.log_name

type_coercions:
  dst_endpoint.port: int
  src_endpoint.port: int

activity_rules:
  - condition_field: action
    condition_values: [deny, block, drop, reject, DENY, BLOCK, DROP, REJECT]
    activity_id: 3          # Reset (connection blocked/dropped)
    action_id: 2            # Denied
    disposition_id: 2       # Blocked
    severity_id: 3          # Medium
  - condition_field: action
    condition_values: [allow, permit, accept, ALLOW, PERMIT, ACCEPT, pass]
    activity_id: 6          # Traffic
    action_id: 1            # Allowed
    disposition_id: 1       # Allowed
    severity_id: 1          # Informational

observer_log_name: syslog
